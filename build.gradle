buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') {
            changing = true
        }
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
}

apply plugin: 'forge'

sourceCompatibility = 1.7
targetCompatibility = 1.7

version = "${projecte_version}"
group = "${projecte_group}"
archivesBaseName = "ProjectE"

minecraft {
    version = "${minecraft_version}-${forge_version}"
    runDir = "eclipse"

    replace "@VERSION@", project.version
    replaceIn "PECore.java"
}

repositories {
    maven { //Waila Repo
        name "Mobius Repo"
        url "https://cursemaven.com"
    }
    maven { //NEI Repo
        name 'CB Repo'
        url "http://chickenbones.net/maven/"
        allowInsecureProtocol = true
    }
    maven {
        name 'Chisel'
        url "http://maven.tterrag.com/"
        allowInsecureProtocol = true
    }
        maven {
        name 'MineTweaker3'
        url "https://maven.blamejared.com/"
        allowInsecureProtocol = true
    }
}
 
dependencies {
    testImplementation group: 'junit', name: 'junit', version:'4.11'

    implementation files("Chisel-CT2.5.0.1-api.jar")
	
    implementation "codechicken:CodeChickenCore:1.7.10-1.0.4.29:dev"
    implementation "codechicken:CodeChickenLib:1.7.10-1.1.1.110:dev"
    implementation "codechicken:NotEnoughItems:1.7.10-1.0.4.83:dev"

    implementation "MineTweaker3:MineTweaker3-MC1710-Main:1.7.10-3.0.11.18"
    implementation "MineTweaker3:MineTweaker3-API:3.0.11.23"
    
}

processResources
{
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
        
    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Dev jar (deobfuscated)
task devJar(type: Jar) {
    from sourceSets.main.output
    classifier = 'dev'
    version = "${project.version}"
}

artifacts {
    archives devJar
}

idea.module.inheritOutputDirs = true